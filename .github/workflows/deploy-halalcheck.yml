name: Déploiement du site HalalCheck

on:
  push:
    branches:
      - main
      - claude/sites-mondiaux-copier-ameliorer-rtp5in
    paths:
      - "projects/halal-scanner/site/**"
      - ".github/workflows/deploy-halalcheck.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/halal-scanner/site

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
