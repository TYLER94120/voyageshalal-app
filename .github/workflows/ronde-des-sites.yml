# La ronde : toutes les 30 minutes, un robot regarde les quatre sites en
# ligne comme un visiteur, et note ce qui ne va pas.
#
# Demande de Mohamed, 10 aout 2026 : « Je n'arrete pas de remonter des
# problemes avec des captures d'ecran. Ce n'est pas normal. »
#
# Il a raison. Le detecteur de pannes de cet empire etait un humain, qui ne
# regarde que les pages ou il passe, et qui ne voit que ce qui creve les
# yeux. Un titre trop long ne se voit pas a l'oeil nu et coute des clics
# tous les jours.
#
# La ronde echoue — croix rouge, et GitHub previent par courriel — UNIQUEMENT
# s'il y a un defaut grave, c'est-a-dire si un visiteur ne recoit pas la
# page. Les defauts moins graves sont ecrits dans docs/ronde/RONDE.md et les
# agents les traitent a leur cycle. Une alerte qui sonne pour un titre trop
# long finirait ignoree, et le jour ou un site tombe vraiment plus personne
# ne regarderait.

name: La ronde des sites

on:
  workflow_dispatch:
    inputs:
      complete:
        description: "Balayage COMPLET (toutes les pages, pas une tranche)"
        type: boolean
        default: false
      sites:
        description: "Limiter a certains sites, separes par des virgules (vide = tous)"
        type: string
        default: ""
  schedule:
    # La patrouille : une tranche du site toutes les 30 minutes.
    - cron: '*/30 * * * *'
    # Le balayage COMPLET, une fois par jour.
    #
    # CE RENDEZ-VOUS N'EST QUE LE PREMIER CHOIX, PAS LA GARANTIE. Pose le
    # 11 aout a 10 h 18, il n'a jamais tourne : GitHub saute une partie des
    # rendez-vous programmes. Sur les 37 heures suivantes, la patrouille
    # « toutes les 30 minutes » aurait du tourner 74 fois — elle a tourne
    # 30 fois, avec un trou de trois heures entre 00 h 08 et 03 h 05, et
    # 02 h 47 tombait dedans.
    #
    # Ce qui fait vraiment tourner le balayage complet est donc dans le script :
    # toute patrouille de nuit qui trouve le releve complet vieux de plus de
    # 20 heures se promeut elle-meme (voir HEURES_AVANT_RELANCE dans
    # outils/ronde-des-sites.py). On ne depend plus d'un evenement qu'on ne
    # controle pas, mais d'un etat qu'on peut lire.
    #
    # Minute 47 : le */30 tombe a :00 et :30, on ne se marche pas dessus. Et le
    # groupe `concurrency` ci-dessous garantit de toute facon qu'une seule des
    # deux tourne a la fois — deux robots sur le meme hote fabriquent de fausses
    # pannes, c'est mesure.
    - cron: '47 2 * * *'

permissions:
  contents: write

concurrency:
  group: ronde-des-sites
  cancel-in-progress: false

jobs:
  ronde:
    runs-on: ubuntu-latest
    env:
      # Complet si on l'a demande a la main, ou si c'est le rendez-vous
      # quotidien qui a declenche ce tour.
      COMPLET: ${{ (inputs.complete || github.event.schedule == '47 2 * * *') && '1' || '' }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Faire la ronde
        id: ronde
        continue-on-error: true
        env:
          RONDE_COMPLETE: ${{ env.COMPLET }}
          RONDE_SITES: ${{ inputs.sites }}
        run: python3 outils/ronde-des-sites.py

      # On affiche le rapport que la ronde vient VRAIMENT de reecrire, pas celui
      # qu'on avait prevu : depuis le rattrapage automatique, une patrouille
      # ordinaire peut se promouvoir en balayage complet sans que ce fichier-ci
      # en sache rien. Se fier a $COMPLET afficherait le mauvais rapport, ou un
      # rapport de la veille.
      - name: Afficher le constat dans le resume du travail
        if: always()
        run: |
          modifies=$(git diff --name-only -- docs/ronde/ | grep '\.md$' || true)
          for f in ${modifies:-docs/ronde/RONDE.md}; do
            cat "$f" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          done

      # On depose le constat AVANT de faire echouer la ronde : sinon, le jour
      # ou un site tombe, la croix rouge arriverait sans le rapport qui dit
      # quoi reparer.
      - name: Deposer le constat dans le depot
        if: always()
        run: |
          git config user.name  "robot-ronde"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ronde/
          git diff --staged --quiet && echo "Rien de nouveau." && exit 0
          git commit -m "Ronde: la liste des defauts a change"
          for essai in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Course avec un autre robot, nouvel essai ($essai)."
            sleep $((essai * 5))
          done

      - name: Conclure
        if: steps.ronde.outcome == 'failure'
        run: |
          echo "::error::Defaut GRAVE detecte — un visiteur ne recoit pas la page. Voir docs/ronde/RONDE.md"
          exit 1
