# Les controles qui tournent tout seuls, a chaque envoi de code.
#
# Pourquoi ce fichier existe : le 11 aout 2026, ce depot contenait sept series
# de tests — cinq pour le moteur de verdict halal, deux pour les robots de
# surveillance — et AUCUN moyen de les lancer autrement qu'a la main.
#
# Ce jour-la, l'agent HalalCheck a livre six corrections successives sur le
# moteur : un interdit invente sur la levure de biere, dix pluriels manques,
# des lardons qui ressortaient halal, de la graisse de porc muette dans un
# cosmetique. A chaque fois les tests ont ete relances a la main, parce que
# quelqu'un y a pense.
#
# **Le moteur de verdict est ce qu'il y a de plus sensible dans l'empire.** Un
# seul verdict faux detruit la confiance qui fait toute la valeur du produit —
# et un faux HALAL fait manger du porc a quelqu'un qui nous a crus.
#
# Ce qui est controle ici, sans qu'on ait a y penser :
#   · le moteur alimentaire et le moteur cosmetique (test:moteur)
#   · les faux negatifs : ce qui est interdit doit etre attrape
#   · les faux positifs : ce qui est licite ne doit PAS etre accuse
#   · les etiquettes en arabe
#   · les deux robots de surveillance, dont les regles de mesure
#
# 12 AOUT 2026 — ces trois lignes-la etaient fausses jusqu'a ce matin. Les
# sondes faux-negatifs, faux-positifs et etiquettes-arabes AFFICHAIENT ce
# qu'elles trouvaient puis sortaient en succes, quoi qu'elles trouvent ; la
# troisieme n'attendait meme aucune valeur, elle imprimait sept lignes. Trois
# des cinq etapes de ce travail ne pouvaient pas virer au rouge.
#
# Mesure, pas supposition : le moteur a ete casse expres (la regle texte
# /gelatine/ remplacee par un motif impossible). « eau, sucre, gelatine,
# arome » ressortait alors HALAL, 0 alerte — et les trois sondes sortaient en
# succes. Le controle etait vert, le pousse serait passe, la mise en ligne
# aussi. Le seul detecteur qui restait, c'etait Mohamed devant son telephone.
# Les trois sondes sortent maintenant en erreur ; verifie dans les deux sens,
# interdit qui passe ET licite accuse a tort.
#
# CE QUI N'EST PAS CONTROLE ICI, et il faut le savoir :
# les sondes qui demandent un vrai navigateur (sonde:photo, sonde:iphone) ne
# tournent pas ici — elles ouvrent Chromium et servent le site. Elles se
# lancent a la main. Un controle automatique qui tait ses angles morts est
# exactement l'instrument qui rassure a tort.

name: Controles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  moteur:
    name: Le moteur de verdict halal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/halal-scanner
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # TypeScript seul, en global. Un `npm ci` installerait tout Expo et
      # React Native pour compiler deux fichiers : plusieurs minutes, et autant
      # d'occasions qu'un controle echoue pour une raison etrangere au moteur.
      - name: Installer TypeScript, et rien d'autre
        run: npm install -g typescript@5.3.3

      # AVANT tout le reste : le fichier servi est-il celui qui est ecrit ?
      #
      # Toutes les sondes lisent site/*.js, le fichier compile. Un build perime
      # leur fait donc tester l'ANCIEN moteur — et passer. Mesure du 13 aout :
      # une correction ecrite dans lib/halal.ts n'avait jamais ete recompilee,
      # et le moteur EN LIGNE rendait encore HALAL sur « vegane + gelatine »,
      # « vegane + carmin » et « vegane + etiquette non halal ». Le commit
      # disait « corrige », les controles etaient verts, le site servait le
      # defaut. Ce controle-ci passe en premier parce qu'il decide si les
      # suivants mesurent quelque chose.
      - name: Le moteur servi est-il celui qui est ecrit ?
        run: npm run verif:build

      # Ensuite : il compile lib/ vers .test-build/, dont les sondes
      # suivantes ont besoin.
      - name: Les tests du moteur
        run: npm run test:moteur

      - name: Faux negatifs — ce qui est interdit doit etre attrape
        run: npm run sonde:faux-negatifs

      # Celle-ci compte autant que la precedente, et on l'oublie toujours :
      # un moteur qui accuse tout est aussi inutile qu'un moteur aveugle.
      - name: Faux positifs — ce qui est licite ne doit PAS etre accuse
        run: npm run sonde:faux-positifs

      - name: Les cosmetiques
        run: npm run sonde:cosmetiques

      - name: Les etiquettes en arabe
        run: npm run sonde:arabe

      # Ces deux-la existaient depuis des jours, savaient deja virer au rouge,
      # et ne tournaient nulle part. Elles ne demandent pas de navigateur : les
      # ajouter coute deux secondes.
      - name: Cosmetiques — les noms INCI qui passaient a travers
        run: npm run sonde:inci

      # Les pages rayon sont GENEREES depuis le moteur. Si le fichier livre
      # differe de ce que le generateur produit, la page ment sur une regle —
      # meme faute que le 13 aout, ou une correction ecrite a la main avait ete
      # effacee a la regeneration suivante.
      - name: Les pages rayon sont-elles celles que le moteur produit ?
        run: |
          npm run build:rayons
          git diff --exit-code --stat site/bonbons.html site/fromage.html site/pain-viennoiserie.html \
            || (echo "::error::une page rayon livree differe de ce que le generateur produit" && exit 1)

      - name: Les nombres et les dates annonces sur le site
        run: npm run verif:chiffres

      # Le moteur face a de VRAIS produits, figes dans fiches-reelles/. Tant
      # que le dossier est vide, cette etape dit « 0 fiche » et passe : elle
      # n'invente pas un succes, elle avoue qu'il n'y a rien a mesurer. Des
      # qu'une fiche y est deposee, elle rend la repartition des verdicts —
      # dont le pourcentage d'INCONNU, le chiffre qui manque depuis le debut.
      - name: Les vraies fiches produit, quand il y en a
        run: npm run sonde:fiches

  # ── L'ECRAN, pas le moteur ────────────────────────────────────────────────
  #
  # Le moteur peut avoir raison et l'ecran mentir : un badge vert fige dans
  # l'historique, un texte illisible sur fond sombre, une camera qui tourne
  # dans le vide, un pays nomme « au France ». Le robot de la ronde ne voit
  # rien de tout cela — ses 16 controles s'arretent a l'enveloppe HTML, avant
  # que le JavaScript ne s'execute. Verifie le 12 aout : « halalcheck.fr
  # 7 pages · 0 defauts », un site de 4 pages dont toute la valeur vient
  # d'apres.
  #
  # C'est donc ICI que se trouvaient les defauts que Mohamed remontait en
  # capture d'ecran. Ces huit sondes existaient deja ; elles ne tournaient
  # qu'a la main, le jour ou quelqu'un y pensait.
  #
  # Duree mesuree dans l'atelier : environ 5 minutes pour les huit. Le travail
  # tourne a cote de « moteur », il ne le retarde pas.
  ecran:
    name: L'ecran, dans un vrai navigateur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/halal-scanner
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright en global, comme TypeScript plus haut, et pour la meme
      # raison : `npm ci` ici installerait Expo et React Native pour ouvrir
      # une page. scripts/playwright-atelier.mjs sait le retrouver via
      # `npm root -g`, et laisse Playwright choisir son propre Chromium quand
      # celui de l'atelier est absent — ce qui est le cas sur un runner.
      # Version figee sur celle de l'atelier, ou les huit sondes passent —
      # relevee avec `npm root -g`, pas choisie de memoire. `playwright` est
      # sur le PATH une fois installe en global : pas de `npx`, qui
      # telechargerait une seconde copie et pourrait installer le navigateur
      # d'une autre version que la bibliotheque.
      - name: Installer Playwright et Chromium
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      # Le site servi aux sondes est celui de site/, compile depuis lib/.
      - name: Construire le site
        run: |
          npm install -g typescript@5.3.3
          npm run build:site

      - name: La camera et le lecteur de codes-barres
        run: npm run sonde:iphone

      - name: La saisie a la main quand la camera ne suffit pas
        run: npm run sonde:saisie

      - name: Les six ecrans de verdict disent une seule chose
        run: npm run sonde:verdicts

      # Un verdict vert fige dans l'historique alors que le moteur a change
      # d'avis : le defaut le plus grave qu'on ait corrige sur l'ecran.
      - name: L'historique suit le moteur
        run: npm run sonde:historique

      - name: Les 24 pays sont nommes avec la bonne preposition
        run: npm run sonde:pays

      - name: Le contraste des textes
        run: npm run sonde:contraste

      - name: Le site tient sans reseau
        run: npm run sonde:hors-ligne

      # Le hors-ligne ne s'arrete pas aux pages. Mesure du 14 aout : les 7
      # polices rapatriees sur notre domaine le 13 n'etaient pas pre-chargees,
      # et le service worker ne controle pas la page qui l'installe — un
      # visiteur arrive une seule fois puis prive de reseau ouvrait le scanner
      # avec la police de secours. 0/7 avant correction, 7/7 apres.
      - name: Les polices survivent a la coupure
        run: npm run sonde:polices

      # La derniere, et la plus lente : elle fabrique une photo de 4032x3024 et
      # joue les six facons dont la lecture d'etiquette peut echouer.
      # Consigne ecrite de Mohamed le 14 aout : ne jamais affirmer plus que
      # ce qu'on sait. Le rond vert disait HALAL sur une simple deduction, et
      # un INCONNU laissait la personne sans issue. Ces deux-la ne reviennent
      # pas sans virer au rouge ici.
      - name: L'ecran n'affirme que ce qu'on sait
        run: npm run sonde:affirmations

      # Test pose par l'ordre SEO du 17 aout : « desactive JavaScript et
      # recharge. Si l'ecran est vide, ce n'est pas fait. » Mesure du 18 aout :
      # scan.html rendait 339 caracteres sans JavaScript, contre 2 898, 4 217 et
      # 16 513 pour les trois autres. Verifie aussi qu'aucune page n'est
      # orpheline — deux liens internes recus au minimum.
      - name: Ce qu'un robot lit sans JavaScript
        run: npm run sonde:sans-js

      - name: La lecture d'etiquette par photo
        run: npm run sonde:photo

  robots:
    name: Les robots de surveillance
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      # Ces deux-la verrouillent la facon de MESURER, pas le site. Ils ont ete
      # ecrits apres que les robots ont annonce, en un seul jour, 104 titres
      # casses qui ne l'etaient pas et une page morte qui repondait tres bien.
      - name: La ronde mesure ce que Google affiche
        run: python3 outils/test-ronde.py

      - name: Une panne du robot n'est pas une page cassee
        run: python3 outils/test-liens-morts.py
